name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - main

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 24 사용
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. Vite 빌드
      - name: Build
        run: npm run build

      # 5. dist 빌드 결과 확인
      # 현재 404 원인 확인을 위한 임시 디버깅 단계
      - name: Check dist
        run: |
          echo "===== DIST FILES ====="
          find dist -maxdepth 3 -type f -print

          echo "===== INDEX.HTML ====="
          head -30 dist/index.html

      # 6. GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. dist 폴더를 Pages 배포 artifact로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # 8. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
